[package]
name = "matrix-ng-bridge"
version = "0.3.16"
edition = "2024"
license = "MIT"
description = "Encrypted Matrix notification bridge for Home Assistant"

[dependencies]
anyhow = "1"
axum = "0.8"
fs2 = "0.4"
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "bundled-sqlite", "rustls-aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
matrix-sdk-crypto = "=0.19.1"

[profile.release]
strip = true

[profile.dev]
debug = 0
